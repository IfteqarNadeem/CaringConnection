name: Build Caring Connection APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CaringConnection_Project_Payload.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q CaringConnection_Project_Payload.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk CaringConnection-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaringConnection-Android-APK
          path: CaringConnection-Test.apk
          retention-days: 30
